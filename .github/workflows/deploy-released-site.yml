name: deploy site after a manual stable release

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    # Only the core package's stable release starts this path. Other package releases and
    # prereleases do not dispatch duplicate deployments. CI publications dispatch directly.
    if: github.event.release.prerelease == false && startsWith(github.event.release.tag_name, '@assemblejs/core@')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release belongs to stable main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/core/package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [ "$RELEASE_TAG" = "@assemblejs/core@$version" ]
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" HEAD
          [ "$(npm view "@assemblejs/core@$version" version)" = "$version" ]
      - name: Publish through the existing product workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml --repo "$GITHUB_REPOSITORY" --ref main
