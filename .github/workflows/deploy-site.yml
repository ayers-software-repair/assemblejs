# Deploy this product's site (site/) to the ayers.repair shop bucket and invalidate its path.
#
# Auth: OIDC role gh-deploy-assemblejs-site (no stored AWS keys) - trust scoped to THIS repo;
# permissions scoped to the s3://ayers-repair-site-993011736775/assemblejs/ prefix and the
# company and AssembleJS CloudFront distributions, nothing else.
#
# site/ IS the whole site: static pages, fonts and images vendored. Two of its directories are
# not in the tree and are written here before the check and the sync: kit/, staged from the
# platform pin, and docs/api/, the API reference, which typedoc generates from the packages'
# sources (DECISIONS 2026-10-05, 2026-10-10). No `--delete` across the prefix: the next channel's
# prefix stands under the product's, and the bucket carries other products' files. The reference
# alone is mirrored with `--delete`, under docs/api/, where nothing but the reference lives, so the
# page of a symbol it no longer has does not stay reachable (the role's grant allows it within the
# product's prefix; DECISIONS 2026-10-11).
#
# TWO JOBS, AND ONLY ONE HOLDS THE ROLE. The reference is generated in a job of its own, which
# installs the workspace, builds it and runs typedoc with no token for the cloud, and hands the
# pages on as an artifact. The job that assumes the role installs nothing and runs nobody's
# code but the checks': a dependency's script never runs beside the right to write the bucket.
#
# TWO PREFIXES, ONE FOLDER. This product publishes twice, which is the npm two-channel rule
# applied to the site: `next` to /assemblejs/next/ alongside the `next` dist-tag, `main` to
# /assemblejs/ alongside `latest`. The branch decides the prefix and the folder is identical.
#
# The paths filter is an exact INCLUDE on the site sources, the platform pin and this workflow,
# never an ignore list - most of a product repo is not the site, so a skip-list publishes whatever
# is added next. Every run regenerates the reference. A push that changes only the packages leaves
# it for a release or dispatch, while a pin change deploys the newly selected shared kit.
name: deploy-site
on:
  push:
    branches: [main, next]
    paths:
      - "site/**"
      - "site-source/**"
      - "package.json"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      source-ref:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-site-assemblejs-${{ inputs.channel || github.ref_name }}
  cancel-in-progress: false

env:
  BUCKET: ayers-repair-site-993011736775
  DIST: E1CZIGG4O8R7UI
  PRODUCT_DIST: E1X8JWYQHVZ2LE

jobs:
  # THE API REFERENCE IS GENERATED HERE, NEVER COMMITTED. The toolchain ci.yml pins, on Node 22:
  # install at the frozen lockfile, build the packages, then `pnpm site:api` runs typedoc (the
  # root typedoc.json, once per package, each package's own typedoc.json naming its entry
  # points) over every published entry point into site/docs/api/. Typedoc reads the
  # sources, not dist; the build runs first so that a tree whose packages do not build
  # publishes nothing. This job may read the repository and nothing else.
  reference:
    name: the API reference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build the packages
        run: pnpm build
      - name: Generate the API reference
        run: pnpm site:api
      # Kept a day: the deploy below takes it within the run, and nothing reads it after.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-reference
          path: site/docs/api
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: reference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}

      # main publishes the product's own prefix; next publishes the channel beneath it.
      - name: Choose the channel's prefix
        id: prefix
        env:
          CHANNEL: ${{ inputs.channel || github.ref_name }}
        run: |
          case "$CHANNEL" in
            main) echo "path=assemblejs" >> "$GITHUB_OUTPUT"; echo "canonical=https://assemblejs.com/" >> "$GITHUB_OUTPUT" ;;
            next) echo "path=assemblejs/next" >> "$GITHUB_OUTPUT"; echo "canonical=https://assemblejs.com/next/" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown site channel: $CHANNEL"; exit 1 ;;
          esac

      # THE KIT IS REFERENCED, NEVER COPIED: one platform pin per product, and everything
      # platform-sourced comes from it. For an npm product the pin is `ayersPlatform` in the root
      # package.json, where a Go product reads its go.mod line.
      - name: Read the platform pin
        id: pin
        run: |
          ref=$(node -p "require('./package.json').ayersPlatform || ''")
          if [ -z "$ref" ]; then
            echo "::error::no ayersPlatform pin in package.json - an empty checkout ref silently means the DEFAULT BRANCH, defeating reference-at-pin"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ayers-software-repair/platform
          ref: ${{ steps.pin.outputs.ref }}
          token: ${{ secrets.RELEASES_PAT }}
          path: _platform
          persist-credentials: false

      - name: Verify the static pages against the shared frame
        run: |
          npm ci --prefix _platform/codestyle --ignore-scripts --no-audit --no-fund
          node _platform/sitekit/build-pages.mjs site

      - name: Stage the kit into the site
        run: |
          rm -rf site/kit && mkdir -p site/kit
          cp _platform/sitekit/*.css site/kit/
          cp _platform/sitekit/landing-{background,worker,renderers,shaders,stores}.js _platform/sitekit/product-downloads.js site/kit/
          cp -R _platform/sitekit/icons site/kit/icons

      # What the job above generated, put where the site links it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-reference
          path: site/docs/api

      # The docs index links this page. Publishing the link without the page is the 404 the
      # site check exists to prevent, and the check exempts a generated page from existing in
      # the tree, so the deploy proves it here instead.
      - name: The reference exists
        run: |
          if [ ! -f site/docs/api/index.html ]; then
            echo "::error::site/docs/api/index.html was not generated; nothing is published"
            exit 1
          fi

      # The same gate a developer runs. A skin whose ink is unreadable, or a page advertised and
      # missing, does not reach the bucket.
      - name: Check the site
        run: node scripts/check-site.mjs --self-test && node scripts/check-site.mjs

      # The notes page has one section for each version the changelogs head, or nothing is
      # published. The script reads files and needs nothing installed.
      - name: Check the release notes
        run: node scripts/check-release-notes.mjs --self-test && node scripts/check-release-notes.mjs

      - name: Set the error page's recovery prefix
        run: sed -i 's|="/assemblejs/|="/${{ steps.prefix.outputs.path }}/|g' site/404.html

      - name: Build canonical metadata and sitemap
        env:
          SITE_CANONICAL: ${{ steps.prefix.outputs.canonical }}
          SITE_PREFIX: ${{ steps.prefix.outputs.path }}
        run: |
          flags=()
          if [ "$SITE_PREFIX" = "assemblejs/next" ]; then flags+=(--noindex); fi
          node _platform/sitekit/build-metadata.mjs site "$SITE_CANONICAL" "${flags[@]}"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::993011736775:role/gh-deploy-assemblejs-site
          aws-region: us-east-1

      # Crawlers read robots.txt at the domain root, including while next is the only channel.
      # The stable sitemap is deliberately kept at its final address until the stable release.
      - name: Publish root search discovery (5 min cache)
        run: |
          aws s3 cp site/robots.txt "s3://$BUCKET/assemblejs/robots.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=300" --only-show-errors

      - name: Sync pages, sitemap and browser code (5 min cache)
        run: |
          aws s3 sync site/ "s3://$BUCKET/${{ steps.prefix.outputs.path }}/" \
            --exclude "*" --include "*.html" --include "*.xml" --include "*.css" --include "*.js" \
            --cache-control "public, max-age=300" --only-show-errors

      # llms.txt and llms-full.txt are the pages as text, so they change when a page does and
      # are cached as the pages are. Named as text in utf-8, whatever the uploader would guess.
      - name: Sync the pages as text (5 min cache)
        run: |
          aws s3 sync site/ "s3://$BUCKET/${{ steps.prefix.outputs.path }}/" \
            --exclude "*" --include "*.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=300" --only-show-errors

      # Everything that is not a page, a manifest, a note or the pages as text: the kit and skin
      # svg marks and fonts under docs/api/assets/. The
      # reference links its assets with a query that changes at each generation (typedoc.json
      # `cacheBust`), so a cached response does not serve the last deploy's search index with this
      # deploy's pages.
      - name: Sync fonts and images (7 day cache)
        run: |
          aws s3 sync site/ "s3://$BUCKET/${{ steps.prefix.outputs.path }}/" \
            --exclude "*.md" --exclude "*.html" --exclude "*.xml" --exclude "*.css" --exclude "*.js" --exclude "*.json" --exclude "*.txt" \
            --cache-control "public, max-age=604800" --only-show-errors

      # The reference's pages stand under docs/api/ and nowhere else, so this mirror deletes the
      # page of a symbol it no longer has. Sizes alone decide what would copy, and every file was
      # uploaded above with its headers at the same size, so nothing copies here and nothing loses
      # its content type or cache control: the step is the delete.
      - name: Retire the reference's pages that are no longer generated
        run: |
          aws s3 sync site/docs/api/ "s3://$BUCKET/${{ steps.prefix.outputs.path }}/docs/api/" \
            --delete --size-only --only-show-errors

      - name: Invalidate CloudFront (this prefix only)
        run: |
          aws cloudfront create-invalidation --distribution-id "$DIST" \
            --paths "/${{ steps.prefix.outputs.path }}/*" \
            --query 'Invalidation.Id' --output text
          aws cloudfront create-invalidation --distribution-id "$PRODUCT_DIST" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text
