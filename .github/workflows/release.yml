name: release

# An owner-approved release tag publishes npm and then the site at that same commit.
# npm trusted publishing remains bound to this file and the release environment. Only the
# `next` channel publishes until the owner opens stable.
#
# A name npm has never seen cannot have a trusted publisher yet, so its first version is staged
# (scripts/first-publish.mjs) with the NPM_STAGE_TOKEN secret of the release environment, a
# granular token whose only write permission is "Read and write (stage only)": it cannot publish,
# and no token here bypasses two-factor authentication. A run that stages anything stops red
# before `changeset publish`; the owner approves each staged name with his second factor and
# re-runs it. Every name already on the registry is published tokenless by `changeset publish`,
# which skips a version the registry has. With every name on the registry the token is never
# read. The owner's steps for the first publish are docs/FIRST-PUBLISH.md.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      channel: ${{ steps.channel.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Check the tag and package versions
        id: channel
        run: node scripts/check-release-channel.mjs
      - name: Hold stable publication
        env:
          NPM_TAG: ${{ steps.channel.outputs.npm-tag }}
        run: |
          if [ "$NPM_TAG" = "latest" ]; then
            echo "::error::stable publication is not yet open: the owner's word opens it (DECISIONS 2026-10-12)"
            exit 1
          fi
      - name: Require the channel's source and successful CI
        env:
          CHANNEL: ${{ steps.channel.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$CHANNEL"
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$passed" -eq 0 ]; then
            echo "::error::This release commit has no successful branch CI run."
            exit 1
          fi
      - name: Check the release notes
        run: node scripts/check-release-notes.mjs --self-test && node scripts/check-release-notes.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check packed packages
        run: node scripts/check-pack.mjs
      - name: Set up npm trusted publishing
        # Staged publishing needs npm 11.15.0 or later.
        run: npm install -g npm@^11.15.0 && npm --version
      - name: Stage the names npm has never seen, for the owner to approve
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
          NPM_TAG: ${{ steps.channel.outputs.npm-tag }}
        run: node scripts/first-publish.mjs --self-test && node scripts/first-publish.mjs --stage "$NPM_TAG"
      - name: Publish the tagged version
        env:
          NPM_CONFIG_PROVENANCE: "true"
        # The checked prerelease state selects next; stable publication defaults to latest.
        run: pnpm changeset publish --no-git-tag

  site:
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
    with:
      channel: ${{ needs.publish.outputs.channel }}
      source-ref: ${{ github.sha }}
    secrets: inherit
