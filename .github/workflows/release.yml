name: release

# Branch pushes prepare version pull requests. Only an owner-approved release tag publishes.
# npm trusted publishing remains bound to this file and the release environment.

on:
  push:
    branches: [main, next]
    tags: ["v*"]
    paths-ignore:
      - ".github/workflows/**"
      - "pnpm-workspace.yaml"
      - ".gitignore"
      - "scripts/identity-gate.sh"
      - "scripts/fixtures/**"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: github.ref_type == 'branch' && (github.ref_name == 'main' || github.ref_name == 'next')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare the version pull request
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      channel: ${{ steps.channel.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Check the tag and package versions
        id: channel
        run: node scripts/check-release-channel.mjs
      - name: Require the channel's source and successful CI
        env:
          CHANNEL: ${{ steps.channel.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$CHANNEL"
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$passed" -eq 0 ]; then
            echo "::error::This release commit has no successful branch CI run."
            exit 1
          fi
      - name: Check the release notes
        run: node scripts/check-release-notes.mjs --self-test && node scripts/check-release-notes.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check packed packages
        run: node scripts/check-pack.mjs
      - name: Set up npm trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version
      - name: Publish the tagged version
        env:
          NPM_CONFIG_PROVENANCE: "true"
        # The checked prerelease state selects next; stable publication defaults to latest.
        run: pnpm changeset publish --no-git-tag

  site:
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
    with:
      channel: ${{ needs.publish.outputs.channel }}
      source-ref: ${{ github.sha }}
    secrets: inherit
