name: release

# Publishes to npm by trusted publishing (OIDC). There is no NPM_TOKEN anywhere and there never
# will be: the trusted publisher on npmjs.com names this repository, this file, and the `release`
# environment. CI configuration changes do not publish packages. With changesets present the action opens
# the version pull request; with none, and a version npm does not have, it publishes. `next` is
# in changesets pre mode (`.changeset/pre.json`, written by `changeset pre enter next`), so what
# it publishes is `1.0.0-next.N` under the `next` tag; on `main` a version is published once.
# GitHub releases come from each package's CHANGELOG.md, the action's default.
#
# THE FIRST PUBLISH IS THE OWNER'S, BY HAND (DECISIONS 2026-10-09). Until the registry has
# @assemblejs/core, the `registry` job answers no and the publish job is skipped: a push costs the
# gate's one request, and no run goes red on the 404 that is the plan until then.

on:
  push:
    branches: [main, next]
    paths-ignore:
      - ".github/workflows/**"
      - "pnpm-workspace.yaml"
      - ".gitignore"
      - "scripts/identity-gate.sh"
      - "scripts/fixtures/**"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  registry:
    name: is the package on the registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      published: ${{ steps.probe.outputs.published }}
    steps:
      # A 404 is the one answer that means "not yet"; any other failure is a real one and stops
      # the run rather than letting a network fault read as "nothing to publish".
      - name: Ask the registry for @assemblejs/core
        id: probe
        run: |
          if npm view @assemblejs/core version >/dev/null 2>probe.err; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -q E404 probe.err; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "The registry has no @assemblejs/core yet. The first publish is the owner's, by hand; nothing publishes from here until then."
          else
            cat probe.err >&2
            exit 1
          fi

  release:
    name: version or publish
    needs: registry
    if: needs.registry.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Pack check
        run: node scripts/check-pack.mjs
      - name: npm 11.5.1 or newer, required for trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version
      - name: Version or publish
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          publish-script: pnpm changeset publish
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
