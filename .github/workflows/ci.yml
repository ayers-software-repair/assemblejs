name: ci

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Release channel checks
        run: node scripts/check-release-channel.mjs --self-test

      # ONE COMMAND, so CI and a developer's machine cannot run different sets of gates.
      #
      # This job used to name eight steps by hand and had drifted to running eight FEWER gates
      # than `pnpm check`: no emoji gate, no organization gate, no mirror gate, no module graph,
      # no version check, no exports check, no unused check, no published-surface check. A CI
      # job that lists its own steps is a second source of truth about what must pass, and the
      # two only ever drift apart.
      #
      # `pnpm check` runs each gate's self-test immediately before trusting it, so a gate that
      # has stopped being able to fail is caught here too. It builds before it tests, because the
      # command line's tests bundle real projects against the built packages, which a fresh
      # checkout does not have.
      - name: Check (identity, headers, emoji, organization, mirror, versions, lint, modules, types, build, tests, exports, pack, unused, publish)
        run: pnpm check

  browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    name: browser proof
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Kept out of `pnpm check` because it needs a browser engine, and the unit suite has to
      # stay runnable anywhere. What runs here is what a DOM shim cannot honestly answer: real
      # layout, a real IntersectionObserver, and real module loading.
      - run: pnpm build
      - run: pnpm test:browser

  conformance:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The product from its own tarballs, over HTTP, as a consumer would have it: the harness
      # builds and packs the packages the fixtures install (core, cli, create and the
      # renderers), creates each fixture project from the
      # starter, installs from the tarballs, starts dist/server.js in production and runs the
      # specs with node's test runner. Kept out of `pnpm check` because it needs the network
      # and minutes; here it runs on every push and pull request.
      - run: pnpm conformance

  # Every example is held to the TypeScript setup its build writes: tsc over the solution,
  # vue-tsc over the Vue views and svelte-check over the Svelte ones. Kept out of `pnpm check`
  # because it builds eleven projects, and `verify` runs that chain on two Node versions.
  examples:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    name: examples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The examples build with the command line's own output, which a fresh checkout lacks.
      - run: pnpm build
      - run: pnpm check:examples

  # Every commit carries a conventional header and a sign-off, and no attribution trailer
  # (CONTRIBUTING). The hooks hold that on a machine that has them; this job holds it for a
  # commit that reached the branch without them, pushed or in a pull request.
  #
  # A pull request is read for its own commits. A push is read from the floor below to the tip,
  # and not for the push's own range, because a newer push cancels the run in flight (the
  # concurrency group above), and that run's commits would then never be read. The floor is the
  # repository's first commit: every commit since passes both steps. A commit that cannot be made
  # to pass, on a branch that is never rewritten, is passed by moving the floor above it, with the
  # reason in docs/DECISIONS.md, never by loosening a step.
  commits:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    name: commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      COMMITS_SINCE: c565074e594ae5d6d3ee617e09bfc5a3d3b1f15c
    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: The commits to read
        id: range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            echo "base=$PR_BASE" >> "$GITHUB_OUTPUT"
            echo "head=$PR_HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "base=$COMMITS_SINCE" >> "$GITHUB_OUTPUT"
            echo "head=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      # The same judge the commit-msg hook asks, with the same config.
      - name: Every header conventional
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"

      - name: Every commit signed off, no other attribution trailer
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: bash scripts/check-trailers.sh "$BASE_SHA" "$HEAD_SHA"
