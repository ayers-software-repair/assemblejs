name: ci

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # ONE COMMAND, so CI and a developer's machine cannot run different sets of gates.
      #
      # This job used to name eight steps by hand and had drifted to running eight FEWER gates
      # than `pnpm check`: no emoji gate, no organization gate, no mirror gate, no module graph,
      # no version check, no exports check, no unused check, no published-surface check. A CI
      # job that lists its own steps is a second source of truth about what must pass, and the
      # two only ever drift apart.
      #
      # `pnpm check` runs each gate's self-test immediately before trusting it, so a gate that
      # has stopped being able to fail is caught here too.
      - name: Check (identity, headers, emoji, organization, mirror, versions, lint, modules, types, tests, build, exports, pack, unused, publish)
        run: pnpm check

  commit-trailers:
    name: commit trailers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit signed off, no other attribution trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-trailers.sh "$BASE_SHA" "$HEAD_SHA"
