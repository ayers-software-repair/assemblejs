name: academy source editor
on:
  pull_request:
    branches: [next]
    paths:
      - "examples/academy/workspace/**"
      - "site/skin.css"
      - "site/fonts.css"
      - "site/fonts/**"
      - "site/mark.svg"
      - "browser/academy-editor/**"
      - ".github/workflows/academy-editor.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [next]
    paths:
      - "examples/academy/workspace/**"
      - "site/skin.css"
      - "site/fonts.css"
      - "site/fonts/**"
      - "site/mark.svg"
      - "browser/academy-editor/**"
      - ".github/workflows/academy-editor.yml"
permissions:
  contents: read
concurrency:
  group: academy-editor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          node examples/academy/workspace/workspace-files.test.mjs
          node examples/academy/workspace/create-source-editor.test.mjs
          node examples/academy/workspace/create-draft-recovery.test.mjs
          node browser/academy-editor/read-save-body.test.mjs
          node browser/academy-editor/create-file-provider.test.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test -c browser/academy-editor/playwright.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: academy-editor
          path: test-results/academy-editor
          if-no-files-found: error
          retention-days: 7
