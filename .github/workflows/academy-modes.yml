name: academy authoring modes
on:
  pull_request:
    branches: [next]
    paths:
      - "examples/academy/workspace/**"
      - "site/skin.css"
      - "site/fonts.css"
      - "site/fonts/**"
      - "site/mark.svg"
      - "examples/market/**"
      - "browser/academy-modes/**"
      - "packages/*/src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/academy-modes.yml"
  push:
    branches: [next]
    paths:
      - "examples/academy/workspace/**"
      - "site/skin.css"
      - "site/fonts.css"
      - "site/fonts/**"
      - "site/mark.svg"
      - "examples/market/**"
      - "browser/academy-modes/**"
      - "packages/*/src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/academy-modes.yml"
permissions:
  contents: read
concurrency:
  group: academy-modes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  modes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          node examples/academy/workspace/assembly-modes.test.mjs
          node examples/academy/workspace/call-project-tool.test.mjs
          node examples/academy/workspace/create-project-files.test.mjs
          node examples/academy/workspace/calculator-title-parts.test.mjs
          node examples/academy/workspace/calculator-presets.test.mjs
          node examples/academy/workspace/calculator-evidence.test.mjs
          node examples/academy/workspace/read-project-version.test.mjs
          node examples/academy/workspace/verify-calculator.test.mjs
          node examples/academy/workspace/restore-verification-focus.test.mjs
          node examples/academy/workspace/calculator-plan.test.mjs
          node examples/academy/workspace/calculator-modes.test.mjs
          node examples/academy/workspace/create-calculator-controls.test.mjs
          node examples/academy/workspace/create-mode-walkthrough.test.mjs
          node examples/academy/workspace/create-academy-workspace.test.mjs
          node browser/academy-modes/source-paths.test.mjs
          node browser/academy-modes/read-preview-response.test.mjs
          node browser/academy-modes/inspect-market-calculator.test.mjs
          node examples/academy/workspace/create-assembly-controls.test.mjs
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test -c browser/academy-modes/playwright.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: academy-authoring-modes
          path: test-results/academy-modes
          if-no-files-found: error
          retention-days: 7
