<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catalogue team</title>
  </head>
  <body>
    <main class="team">
      <h1>The catalogue team's server</h1>
      <p>
        This server owns what the shop sells: the shelves, each product and its facts. The shop
        places these assemblies on its own pages from here, over HTTP. Every one of them is also
        served on this server's own pages, so the team can see its work without the shop.
      </p>
      <assembly name="category-list"></assembly>
    </main>
  </body>
</html>
