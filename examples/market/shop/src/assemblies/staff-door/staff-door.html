<section class="door" aria-labelledby="door-title">
  <h1 id="door-title">Staff</h1>
  <p>The stock board is for staff. Sign in with the staff key.</p>
  <form>
    <div class="field">
      <label for="door-key">Staff key</label>
      <input id="door-key" name="key" type="password" autocomplete="current-password" required />
    </div>
    <p class="door-said" role="alert"></p>
    <button type="submit">Sign in</button>
  </form>
</section>
